<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WebRTC QoS Monitor — Settings</title>
<link rel="stylesheet" href="ui.css" />
</head>
<body>
  <div class="options">
    <h1>WebRTC QoS Monitor</h1>
    <p class="lede">Collects RTCPeerConnection stats (bitrate, jitter, loss, RTT, codec, ICE state) via ObserveRTC client-monitor-js. It never captures audio/video content.</p>

    <section class="section">
      <h2>Platforms</h2>
      <div id="platformList"></div>
      <div class="field" style="margin-top:14px;">
        <label for="customDomain">Add another domain (e.g. call-center.example.com)</label>
        <input type="text" id="customDomain" placeholder="*.example.com" />
        <div class="hint">You'll be asked to grant the extension access to this site.</div>
        <button class="btn" id="addDomainBtn" style="margin-top:8px;">Add domain</button>
      </div>
    </section>

    <section class="section">
      <h2>Local logging</h2>
      <div class="field row" style="border:none;padding:0 0 12px;">
        <label style="margin:0;">Store events in this browser (IndexedDB)</label>
        <label class="switch"><input type="checkbox" id="localEnabled" /><span class="slider"></span></label>
      </div>
      <div class="field">
        <label for="maxEntries">Max stored events (oldest pruned first)</label>
        <input type="number" id="maxEntries" min="100" step="100" />
      </div>
      <div class="field">
        <label for="retentionDays">Retention (days, 0 = keep forever)</label>
        <input type="number" id="retentionDays" min="0" step="1" />
      </div>
    </section>

    <section class="section">
      <h2>What gets recorded</h2>
      <div class="field row" style="border:none;padding:0 0 10px;">
        <label style="margin:0;">Periodic stat samples</label>
        <label class="switch"><input type="checkbox" id="logSamples" /><span class="slider"></span></label>
      </div>
      <div class="field row" style="border:none;padding:0;">
        <label style="margin:0;">Detected quality issues (freezes, packet loss spikes, etc.)</label>
        <label class="switch"><input type="checkbox" id="logIssues" /><span class="slider"></span></label>
      </div>
      <div class="field" style="margin-top:12px;">
        <label for="collectingPeriod">Stats collection interval (ms)</label>
        <input type="number" id="collectingPeriod" min="500" step="500" />
      </div>
      <div class="field">
        <label for="samplingPeriod">Sample emission interval (ms)</label>
        <input type="number" id="samplingPeriod" min="1000" step="500" />
      </div>
    </section>

    <div class="save-bar">
      <span class="save-status" id="saveStatus">All changes saved</span>
      <button class="btn" id="saveBtn" style="flex:none;padding:8px 18px;">Save</button>
    </div>
  </div>
  <script src="options.js" type="module"></script>
</body>
</html>
